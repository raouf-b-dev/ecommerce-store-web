name: Setup Node and install
description: Setup Node from .nvmrc (npm cache), install the npm pinned in package.json devEngines, and run npm ci.

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm

    # No Node release bundles npm 12 yet, so install the exact npm pinned in
    # package.json devEngines.packageManager (the single source).
    - name: Install pinned npm
      shell: bash
      run: |
        npm_version="$(node -p "require('./package.json').devEngines.packageManager.version")"
        npm install -g "npm@${npm_version}"
        npm --version

    - name: Install dependencies
      shell: bash
      run: npm ci
