name: Setup Node and install
description: Setup Node from .nvmrc, install the npm pinned in package.json devEngines, restore the npm cache, and run npm ci.

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        # setup-node's npm cache (explicit, or automatic via devEngines) runs
        # `npm config get cache` with the bundled npm, which fails devEngines.
        # Keep it off; the npm cache is restored below with the pinned npm.
        package-manager-cache: false

    # No Node release bundles npm 12 yet, so install the exact npm pinned in
    # package.json devEngines.packageManager (the single source).
    - name: Install pinned npm
      shell: bash
      run: |
        npm_version="$(node -p "require('./package.json').devEngines.packageManager.version")"
        npm install -g "npm@${npm_version}"
        npm --version

    - name: Cache npm
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('.nvmrc') }}-npm-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-${{ hashFiles('.nvmrc') }}-npm-

    - name: Install dependencies
      shell: bash
      run: npm ci
