name: CI

on:
  push:
    branches:
      - master
      - develop
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:
    inputs:
      api_ref:
        description: ecommerce-store-api branch or tag that Playwright E2E runs against
        required: false
        default: master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node and install
        uses: ./.github/actions/setup-node-ci

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node and install
        uses: ./.github/actions/setup-node-ci

      - name: Run TypeScript typecheck
        run: npm run typecheck
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.test

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node and install
        uses: ./.github/actions/setup-node-ci

      - name: Run unit tests
        run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node and install
        uses: ./.github/actions/setup-node-ci

      - name: Run build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.test
          NEXT_PUBLIC_STOREFRONT_ORIGIN: https://storefront.test

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node and install
        uses: ./.github/actions/setup-node-ci

      - name: Dependency audit (high/critical)
        run: npm audit --omit=dev --audit-level=high

  e2e-prod:
    name: Production Status E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node and install
        uses: ./.github/actions/setup-node-ci

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run production status check
        run: npm run test:e2e:prod

  # Full shopper suite against a real API, required on release paths into master.
  # Demo seed passwords come from .secrets.example; optional GH secrets override.
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.base_ref == 'master') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
    needs: [build]
    env:
      API_REF: ${{ inputs.api_ref || 'master' }}
      API_LOG: ${{ github.workspace }}/e2e-artifacts/api.log
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Materialize e2e credentials
        run: |
          cp .secrets.example .secrets
          echo "E2E credentials: .secrets.example defaults; non-empty GitHub secrets override."

      - name: Setup Node and install
        uses: ./.github/actions/setup-node-ci

      # CI provisions the API. The storefront suite only calls it over HTTP.
      - name: Clone ecommerce-store-api
        run: |
          git clone --depth 1 --branch "$API_REF" https://github.com/raouf-b-dev/ecommerce-store-api.git ../ecommerce-store-api
          git -C ../ecommerce-store-api log -1 --format='API %h %s'

      - name: Configure API environment
        working-directory: ../ecommerce-store-api
        run: |
          set -euo pipefail
          jwt_key="$(openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 2>/dev/null | awk '{printf "%s\\n", $0}')"
          grep -E '^(POSTGRES_IMAGE|POSTGRES_CONTAINER_NAME|REDIS_IMAGE|REDIS_CONTAINER_NAME|CORS_ALLOWED_ORIGINS|STORE_DEFAULT_CURRENCY)=' .env.example > .env.development
          # The Next server and every browser share one client IP, so the default
          # global throttle (100 req/min) returns 429 mid-suite. Auth limits still apply.
          cat >> .env.development <<EOF
          NODE_ENV=development
          PORT=3000
          PUBLIC_BASE_URL=http://localhost:3000
          DB_HOST=localhost
          DB_PORT=5432
          DB_USERNAME=postgres
          DB_PASSWORD=postgres
          DB_DATABASE=ecommerce_e2e
          REDIS_HOST=localhost
          REDIS_PORT=6379
          REDIS_INSIGHT_PORT=8001
          REDIS_PASSWORD=ci-redis
          REDIS_KEYPREFIX=ecom:e2e:
          REDIS_DB=0
          JWT_PRIVATE_KEY="${jwt_key}"
          LOG_TRANSPORT=console
          LOG_LEVEL=info
          METRICS_API_KEY=ci-metrics
          THROTTLE_GLOBAL_LIMIT=100000
          OTEL_TRACING_ENABLED=false
          PAYMENT_MOCK_AUTO_COMPLETE=true
          EOF

      - name: Start Postgres and Redis
        working-directory: ../ecommerce-store-api
        env:
          METRICS_API_KEY: ci-metrics
        run: docker compose --env-file .env.development up -d --wait postgres redis

      - name: Install API dependencies
        working-directory: ../ecommerce-store-api
        run: npm ci --no-audit --no-fund

      - name: Migrate and seed API database
        working-directory: ../ecommerce-store-api
        run: |
          npm run migration:run:dev
          npm run db:seed

      - name: Build and start API
        working-directory: ../ecommerce-store-api
        run: |
          set -euo pipefail
          npm run build
          mkdir -p "$(dirname "$API_LOG")"
          NODE_ENV=development nohup node dist/main.js > "$API_LOG" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/health/readiness > /dev/null 2>&1; then
              echo "API ready at http://localhost:3000"
              exit 0
            fi
            sleep 2
          done
          echo "::error::API did not become ready within 120s"
          tail -n 100 "$API_LOG"
          exit 1

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_STOREFRONT_ORIGIN: http://localhost:3100
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3000
          # Optional overrides. Empty (unset secret) is stripped in playwright.config.ts
          # so .secrets.example fills demo seed credentials.
          E2E_CUSTOMER_EMAIL: ${{ secrets.E2E_CUSTOMER_EMAIL }}
          E2E_CUSTOMER_PASSWORD: ${{ secrets.E2E_CUSTOMER_PASSWORD }}
          E2E_CUSTOMER_NEW_PASSWORD: ${{ secrets.E2E_CUSTOMER_NEW_PASSWORD }}

      - name: Upload Playwright traces and API log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-e2e-${{ github.run_attempt }}
          path: |
            test-results/
            e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  ci:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-tests, build, audit, e2e-prod, e2e]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          # Playwright E2E must actually pass on PRs into master and pushes to master;
          # elsewhere it is skipped and only a failure counts.
          e2e_required=false
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "$GITHUB_BASE_REF" = "master" ]; then
            e2e_required=true
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/master" ]; then
            e2e_required=true
          fi
          echo "event: $GITHUB_EVENT_NAME ($GITHUB_REF), e2e required: $e2e_required"

          failed=false
          check() {
            local name="$1" status="$2" require_success="$3"
            echo "$name: $status"
            if [ "$status" = "failure" ] || [ "$status" = "cancelled" ]; then
              echo "::error::$name $status"
              failed=true
            elif [ "$require_success" = true ] && [ "$status" != "success" ]; then
              echo "::error::$name was $status but must succeed on this run"
              failed=true
            fi
          }

          check lint "${{ needs.lint.result }}" false
          check typecheck "${{ needs.typecheck.result }}" false
          check unit-tests "${{ needs.unit-tests.result }}" false
          check build "${{ needs.build.result }}" false
          check audit "${{ needs.audit.result }}" false
          check e2e-prod "${{ needs.e2e-prod.result }}" false
          check e2e "${{ needs.e2e.result }}" "$e2e_required"

          if [ "$failed" = true ]; then
            echo "One or more required jobs did not pass."
            exit 1
          fi

          echo "All checks passed successfully!"

  # Docker jobs mirror ecommerce-store-api. The image is the local demo build:
  # next build inlines the NEXT_PUBLIC_* origins below, and API_BASE_URL /
  # API_INTERNAL_BASE_URL override the API origin at run time.
  docker-validate:
    name: Docker Validate
    runs-on: ubuntu-latest
    needs: [ci]
    # ci runs with always(), so the implicit success() check would skip this job;
    # gate on ci's result instead.
    if: ${{ !cancelled() && needs.ci.result == 'success' && github.event_name == 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # linux/amd64 only: the arm64 build runs under QEMU and is left to Docker Publish.
      - name: Build production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: ecommerce-store-web:ci-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=http://localhost:3000
            NEXT_PUBLIC_STOREFRONT_ORIGIN=http://localhost:3100
            NEXT_PUBLIC_ALLOW_LOOPBACK_ORIGIN=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        env:
          IMAGE: ecommerce-store-web:ci-${{ github.sha }}
        run: |
          docker run -d --name web -p 3100:3100 -e API_BASE_URL=https://api.example.test "$IMAGE"
          for _ in $(seq 1 30); do
            if curl -fs -o /dev/null http://localhost:3100/icon.svg; then
              break
            fi
            sleep 1
          done
          curl -fsS -o /dev/null http://localhost:3100/icon.svg
          curl -fsS http://localhost:3100/runtime-config.js | grep -F '"apiBaseUrl":"https://api.example.test"'
          docker rm -f web

  docker-publish:
    name: Docker Publish
    runs-on: ubuntu-latest
    needs: [ci]
    if: ${{ !cancelled() && needs.ci.result == 'success' && github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # npm ci and next build run per platform, so arm64 needs emulation.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/raouf-b-dev/ecommerce-store-web
          tags: |
            type=sha,prefix=sha-,enable=${{ github.ref_type == 'branch' }}
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=http://localhost:3000
            NEXT_PUBLIC_STOREFRONT_ORIGIN=http://localhost:3100
            NEXT_PUBLIC_ALLOW_LOOPBACK_ORIGIN=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
