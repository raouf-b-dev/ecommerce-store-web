name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node and install
        uses: ./.github/actions/setup-node-ci

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node and install
        uses: ./.github/actions/setup-node-ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node and install
        uses: ./.github/actions/setup-node-ci

      - name: Run unit tests
        run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node and install
        uses: ./.github/actions/setup-node-ci

      - name: Run build
        run: npm run build
        env:
          NEXT_PUBLIC_STOREFRONT_ORIGIN: https://storefront.test

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node and install
        uses: ./.github/actions/setup-node-ci

      - name: Dependency audit (high/critical)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node and install
        uses: ./.github/actions/setup-node-ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Verify required E2E secrets
        run: |
          if [ -z "${{ secrets.E2E_CUSTOMER_EMAIL }}" ] || [ -z "${{ secrets.E2E_CUSTOMER_PASSWORD }}" ]; then
            echo "::error::E2E secrets (E2E_CUSTOMER_EMAIL, E2E_CUSTOMER_PASSWORD) are required for Playwright E2E execution."
            exit 1
          fi

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          E2E_SKIP_DB_SEED: '1'
          NEXT_PUBLIC_STOREFRONT_ORIGIN: http://localhost:3100
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.E2E_API_BASE_URL || 'http://localhost:3000' }}
          E2E_CUSTOMER_EMAIL: ${{ secrets.E2E_CUSTOMER_EMAIL }}
          E2E_CUSTOMER_PASSWORD: ${{ secrets.E2E_CUSTOMER_PASSWORD }}
          E2E_CUSTOMER_NEW_PASSWORD: ${{ secrets.E2E_CUSTOMER_NEW_PASSWORD }}

  ci:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-tests, build, audit]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          lint_status="${{ needs.lint.result }}"
          typecheck_status="${{ needs.typecheck.result }}"
          unit_status="${{ needs.unit-tests.result }}"
          build_status="${{ needs.build.result }}"
          audit_status="${{ needs.audit.result }}"

          echo "lint: $lint_status"
          echo "typecheck: $typecheck_status"
          echo "unit-tests: $unit_status"
          echo "build: $build_status"
          echo "audit: $audit_status"

          for status in "$lint_status" "$typecheck_status" "$unit_status" "$build_status" "$audit_status"; do
            if [ "$status" = "failure" ] || [ "$status" = "cancelled" ]; then
              echo "One of the required parallel jobs failed or was cancelled."
              exit 1
            fi
          done

          echo "All checks passed successfully!"
